name: Build and deploy to Azure

# Builds the container in Azure Container Registry and rolls the Container App
# onto the new image.
#
# Requires three repository secrets:
#   AZURE_CREDENTIALS   output of `az ad sp create-for-rbac --json-auth` for a
#                       principal with Contributor on the resource group
#   ACR_NAME            container registry name, without .azurecr.io
#   AZURE_RESOURCE_GROUP / AZURE_CONTAINERAPP_NAME  target resources
#
# Every push to main deploys to production. Documentation-only changes are
# skipped so they do not spend build minutes or roll a new revision.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_NAME: thco-crm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build inside ACR rather than on the runner: the build context includes
      # ~260MB of frontend assets, and ACR keeps that traffic inside Azure.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --image "${IMAGE_NAME}:latest" \
            --file Dockerfile .

      - name: Roll the container app onto the new image
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Wait for the app to report healthy
        run: |
          fqdn=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Polling https://${fqdn}/healthz"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${fqdn}/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${i} attempt(s): https://${fqdn}"
              exit 0
            fi
            echo "  attempt $i: HTTP ${code:-none}"
            sleep 10
          done
          echo "App did not become healthy within 5 minutes."
          exit 1
