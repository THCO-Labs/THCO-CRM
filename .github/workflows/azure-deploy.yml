name: Build and deploy to Azure

# Builds the container in Azure Container Registry and rolls the Container App
# onto the new image.
#
# Requires three repository secrets:
#   AZURE_CREDENTIALS   output of `az ad sp create-for-rbac --json-auth` for a
#                       principal with Contributor on the resource group
#   ACR_NAME            container registry name, without .azurecr.io
#   AZURE_RESOURCE_GROUP / AZURE_CONTAINERAPP_NAME  target resources
#
# Every push to main deploys to production. Documentation-only changes are
# skipped so they do not spend build minutes or roll a new revision.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_NAME: thco-crm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built on the runner with BuildKit rather than `az acr build`, so layers
      # can be cached between runs. ACR's quick build starts cold every time,
      # which meant reinstalling ~1,600 npm and ~180 pip packages even for a
      # one-line frontend change -- around nine minutes per deploy.
      #
      # The cache lives in the registry itself, so it survives across runners.
      # Only layers whose inputs changed are rebuilt and pushed.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/thco-crm:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/thco-crm:latest
          cache-from: type=registry,ref=${{ secrets.ACR_NAME }}.azurecr.io/thco-crm:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_NAME }}.azurecr.io/thco-crm:buildcache,mode=max
          provenance: false
          # Baked into the image so the running app can say which commit it is.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

      - name: Roll the container app onto the new image
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"

      # Waits for THIS commit to be the one answering, not merely for something
      # to answer. /healthz returns 200 from the previous container just as
      # readily, so polling it proved only that the app was up -- which is how
      # two commits reported a successful deploy while production carried on
      # serving the build before them.
      - name: Wait for this commit to be the one serving
        run: |
          fqdn=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Waiting for ${GITHUB_SHA} at https://${fqdn}/version"
          for i in $(seq 1 40); do
            live=$(curl -s --max-time 30 "https://${fqdn}/version" \
                   | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live after ${i} attempt(s): ${live}"
              exit 0
            fi
            echo "  attempt $i: serving ${live:-nothing}"
            sleep 15
          done
          echo "::error::${GITHUB_SHA} never came up. Production is still serving ${live:-an unknown build}."
          exit 1
