name: Scheduled jobs

# Drives work that must happen on a clock even when the app is idle.
#
# The application scales to zero on Container Apps, so an in-process scheduler
# only fires if something happened to be running at the time. Calling the app
# from here both wakes it and runs the job.
#
# Required repository secrets:
#   APP_BASE_URL      https://<app>.azurecontainerapps.io
#   SCHEDULER_TOKEN   shared secret, matching the app's SCHEDULER_TOKEN
#
# GitHub's scheduler is best-effort and can lag under load, which is fine
# here: reminders are deduplicated per contact, occasion, lead time and year,
# and mailbox imports resume from a stored cursor and recognise an already
# imported document by its hash. A late or repeated run cannot double up.

on:
  schedule:
    # 06:00 UTC daily — 07:00 in Lagos, before the working day.
    - cron: '0 6 * * *'
    # The overnight backlog work lives in mailbox-drain.yml now. Scheduling it
    # here every twenty minutes did not work: GitHub delivered fifteen runs of
    # the thirty-six asked for, because its cron throttles frequent schedules.
    # That workflow loops inside one job instead, which does not depend on the
    # scheduler firing on time.

  workflow_dispatch:
    inputs:
      job:
        description: 'Run a single job only (blank runs all)'
        required: false
        default: ''

# Shared with mailbox-drain.yml, because both move the same cursor: an overnight
# drain still running at 06:00 and this waking alongside it would re-read each
# other's messages.
concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

# Flip to 'true' to pause the daily mailbox import again -- worth doing before
# any bulk load against the database.
#
# Paused 24 August 2026: resume_files (CV binaries stored inline) grew to
# 26GB of the cluster's 32GB, and the database is now refusing writes
# entirely (NotWritablePrimary). Importing more mail only makes that worse.
# Un-pause once storage capacity is actually resolved, not before.
env:
  MAILBOX_IMPORT_PAUSED: 'true'

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      # Sequential: both jobs hit the same container, and there is no reason
      # to have them competing for a cold start.
      max-parallel: 1
      # One job failing must not prevent the other from running -- a mailbox
      # outage should never suppress a client's birthday reminder.
      fail-fast: false
      matrix:
        job: [relationship-reminders, mailbox-import]

    steps:
      - name: Run ${{ matrix.job }}
        # Paused on 18 August 2026 while the resume_files migration was
        # loading the database hard enough that every document failed with
        # code 50; resumed on 20 August once that finished and the cluster
        # moved off the free tier.
        #
        # Only the schedule is ever paused -- "Run workflow" with
        # job=mailbox-import still works, so it can be tried by hand at any
        # point, including while paused.
        if: ${{ (github.event.inputs.job == '' || github.event.inputs.job == matrix.job)
                && !(matrix.job == 'mailbox-import'
                     && env.MAILBOX_IMPORT_PAUSED == 'true'
                     && github.event_name == 'schedule') }}
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          JOB: ${{ matrix.job }}
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "APP_BASE_URL or SCHEDULER_TOKEN is not set."
            exit 1
          fi

          # The first request may have to start a cold container, so allow a
          # generous timeout and one retry before treating it as a failure.
          #
          # --max-time is deliberately below Container Apps' own 240s ingress
          # limit. Waiting longer than the gateway will wait achieves nothing:
          # it just turns our own timeout into the gateway's 504.
          for attempt in 1 2; do
            echo "Attempt ${attempt} for ${JOB}..."
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              --max-time 230 \
              -X POST "${BASE}/api/internal/run-scheduled-job?job=${JOB}" \
              -H "X-Scheduler-Token: ${TOKEN}" || echo "000")

            if [ "$code" = "200" ]; then
              echo "Completed:"
              cat /tmp/out.json
              exit 0
            fi

            echo "  HTTP ${code}"
            [ -s /tmp/out.json ] && cat /tmp/out.json

            # A 504 is the gateway giving up, not the job. The run carries on
            # server-side, so retrying starts a second one over the identical
            # window -- which is what produced two concurrent imports every
            # morning from 10 August. Jobs are now bounded to finish inside the
            # gateway's limit, so a 504 means something is wrong that a retry
            # will not fix.
            if [ "$code" = "504" ]; then
              echo "  Not retrying: the job is still running on the server and"
              echo "  a second call would duplicate it."
              exit 1
            fi

            sleep 20
          done

          echo "${JOB} did not complete successfully."
          exit 1
