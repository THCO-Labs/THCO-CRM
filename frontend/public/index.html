        <meta charset="utf-8" />

        <meta name="theme-color" content="#000000" />
        <meta name="description" content="THCO Internal Portal - AI-powered tools organized by business unit" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a

        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>THCO | Internal Portal</title>

        <!--
        Nothing third-party is loaded here, deliberately. Four things used to
        be, all left over from the template this app was generated from:

          assets.emergent.sh/scripts/emergent-main.js  loaded on every page
          assets.emergent.sh/scripts/debug-monitor.js  and a Tailwind CDN build
          a hidden link back to app.emergent.sh
          PostHog, with session recording switched on

        The first patched fetch and XHR, which is why every request in the
        network tab -- including this app's own heartbeat and unread-count --
        showed emergent-main.js as its initiator.

        The PostHog block mattered more. It carried a hardcoded project key
        that appears nowhere else in this repository: not in src, not in the
        backend, not in any environment file. It was never configured here, so
        the recordings were going to whoever owns that key. With
        `session_recording` enabled, that means the screens of an internal CRM
        holding candidate CVs, staff records and client contacts.

        This application already has its own analytics, served by its own
        backend (/api/analytics/heartbeat), so nothing was lost by removing it.
        -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
